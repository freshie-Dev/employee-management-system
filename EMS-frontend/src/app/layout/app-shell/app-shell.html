<header class="shell-header">
  <a class="brand" routerLink="/dashboard">
    EMS<span>.</span>
  </a>
  <nav aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="active">
      Workspace
    </a>
    @if (
    store.hasRole('SYSTEM_ADMIN') ||
    store.hasRole('HR_MANAGER')
    ) {
    <a
      routerLink="/departments" routerLinkActive="active">
      Departments
    </a>
    <a
      routerLink="/designations" routerLinkActive="active">
      Designations
    </a>
    <a
      routerLink="/employees"
      routerLinkActive="active">
      Employees
    </a>
    }
    <a routerLink="/settings/appearance" routerLinkActive="active">
      Appearance
    </a>
  </nav>
  <div class="account">
    <span>{{ store.session()?.username }}</span>
    <button
      pButton
      type="button"
      variant="text"
      severity="secondary"
      (click)="auth.logout()">
      Sign Out
      <svg data-p-icon="sign-out"></svg>
    </button>
  </div>
</header>
<div class="outlet">
  <router-outlet />
</div>


<header class="shell-header">

  <!-- Brand -->
  <a class="brand" routerLink="/dashboard">
    EMS<span>.</span>
  </a>

  <!-- Dynamic Navigation -->
  <nav aria-label="Main navigation">

    @for (item of visibleNavItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
      >
        {{ item.label }}
      </a>
    }

  </nav>

  <!-- Account Actions -->
  <div class="account">

    <a
      class="palette-icon"
      pTooltip="Custom Theme"
      routerLink="/settings/appearance"
      routerLinkActive="active"
    >
      <svg data-p-icon="palette"></svg>
    </a>

    <span>{{ store.session()?.username }}</span>

    <button
      pButton
      type="button"
      variant="text"
      severity="secondary"
      (click)="auth.logout()"
    >
      Sign Out
      <svg data-p-icon="sign-out"></svg>
    </button>

  </div>

</header>

<!-- Routed Content -->
<div class="outlet">
  <router-outlet />
</div>
